version: "3.9"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: vymed-postgres
    environment:
      POSTGRES_DB: vymed
      POSTGRES_USER: vymed
      POSTGRES_PASSWORD: vymed_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vymed"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: vymed-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: vymed-backend
    environment:
      STELLAR_NETWORK: TESTNET
      STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
      DATABASE_URL: postgresql+asyncpg://vymed:vymed_dev_password@postgres:5432/vymed
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../backend:/app
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  # React Frontend
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: vymed-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ../../frontend:/app
      - /app/node_modules
    command: pnpm run dev --host

volumes:
  postgres_data:
  redis_data:
